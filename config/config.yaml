# Basic Settings
output:
  directory: "data/raw"
  filename: "insider_trades.csv"
  format: "csv"  # Possible values: csv, parquet

# Scraping Settings
scraping:
  start_year: 2018  # From which year should data be retrieved (8 years of data: 2018-2025)
  start_month: 1    # From which month in start_year
  max_workers: 5   # Number of parallel downloads
  retry_attempts: 3 # Number of retry attempts on errors
  timeout: 30       # Timeout in seconds for HTTP requests

# Filter Settings (Data Quality)
filters:
  min_transaction_value: 50000 # Minimum transaction value in USD ($50k threshold)
                               # Eliminates ~51% of small/automatic transactions (noise)
                               # Keeps ~41,000 high-quality transactions (2018-2025)
                               # Analysis: see analyze_transaction_values.py
  transaction_types: ["P"]     # P = Purchase only (S = Sale, A = Award, etc.)
  exclude_companies: []        # List of ticker symbols to exclude
  include_companies: []        # List of ticker symbols to include
  min_shares_traded: 0         # Minimum number of traded shares

# Logging Settings
logging:
  level: "INFO"               # DEBUG, INFO, WARNING, ERROR
  file: "openinsider.log"
  rotate_logs: true          # Archive old logs
  max_log_size: 10           # Maximum log size in MB

# Cache Settings
cache:
  enabled: true              # Enable/disable cache
  directory: ".cache"        # Cache directory
  max_age: 24               # Maximum age of cache files in hours
